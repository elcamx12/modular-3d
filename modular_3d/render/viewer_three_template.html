<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ViewerThree — 디자인 탭 3D</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #f5f7fa;
    width: 100%; height: 100%;
    font-family: 'Pretendard', 'Segoe UI', sans-serif;
  }
  #container { width: 100vw; height: 100vh; position: relative; }
  #canvas { display: block; width: 100%; height: 100%; }
  #empty-msg {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #6b7785; font-size: 13px;
    background: rgba(255,255,255,0.7);
    padding: 14px 22px; border-radius: 10px;
    border: 1px solid #d1d9e0;
  }
  #info {
    position: absolute; bottom: 8px; right: 8px; z-index: 10;
    color: #6b7785; font-size: 10px;
    background: rgba(255,255,255,0.7);
    padding: 4px 8px; border-radius: 4px;
    border: 1px solid #d1d9e0;
  }
</style>
</head>
<body>
<div id="container">
  <div id="empty-msg">three.js 뷰 — 부재 로딩 대기</div>
  <div id="info">왼클릭=회전 · 우클릭=이동 · 휠=줌</div>
  <div id="member-tip" style="position:absolute; display:none; z-index:20;
    pointer-events:none; background:rgba(20,24,28,0.92); color:#fff;
    font-size:12px; padding:3px 7px; border-radius:4px; white-space:nowrap;"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
"use strict";

// ─────────────────────────────────────────────────────────
// 좌표·단위 정책 (UI_마이그레이션/05_M2_설계.md 참조)
// - Python Scene 좌표: x=길이, y=폭, z=높이, 단위 mm
// - three.js 도 *동일* 컨벤션 (운송탭의 y↔z 교환·mm→m 환산 안 함)
// - 카메라 up = (0, 0, 1)
// ─────────────────────────────────────────────────────────

let scene, camera, renderer, controls;
let qtBridge = null;

// 부재·실 메쉬 레지스트리 — id → THREE.Mesh
const componentMeshes = {};
const roomMeshes = {};

// 고스트·스냅 마커·선택 박스 — 단일 인스턴스
let ghostMesh = null;
let openingGhostMesh = null;
let roomGhostMesh = null;
let snapMarker = null;
let selectionBox = null;

// 벽 채움 색(mesh_builder COLOR_WALL_NL_PARTITION) — 벽 전용 재질·윤곽선 판별 기준.
const WALL_RGB = [0.860, 0.870, 0.900];

// ─────────────────────────────────────────────────────────
// 초기화
// ─────────────────────────────────────────────────────────
function init() {
  const container = document.getElementById('container');
  const w = container.clientWidth, h = container.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);  // 3개 three 뷰 공통 흰 배경

  // 카메라 — Viewer3D 의 CustomCamera 와 같은 초기값
  // distance=20000mm, fov=45°, elevation=30°, azimuth=-60°, center=(3000,3000,0)
  // [M2-c 사용자 피드백 2026-05-28] vispy TurntableCamera 와 three.js 의
  // azimuth 컨벤션 차이로 위에서 본 기준 시야가 90도 어긋남. azim 을
  // -90° 보정해 vispy 와 동일한 시점으로 맞춤 (반시계 회전).
  // [2026-06-05] 원경 절단면 200000→2000000 확대 — 18층 등 고층에서 멀리 빼도
  //   건물이 잘리지 않도록. 줌아웃 한계(maxDistance) 확대와 짝을 맞춤.
  camera = new THREE.PerspectiveCamera(45, w / h, 10, 2000000);
  const dist = 20000;
  const elev = 30 * Math.PI / 180;
  const azim_vispy_deg = -60;
  const azim = (azim_vispy_deg - 90) * Math.PI / 180;
  const cx = 3000, cy = 3000, cz = 0;
  camera.position.set(
    cx + dist * Math.cos(elev) * Math.sin(azim),
    cy + dist * Math.cos(elev) * Math.cos(azim),
    cz + dist * Math.sin(elev),
  );
  camera.up.set(0, 0, 1);
  camera.lookAt(cx, cy, cz);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));  // 고DPI 성능 제한(3뷰 공통)
  renderer.setSize(w, h);
  renderer.domElement.id = 'canvas';
  container.appendChild(renderer.domElement);

  // [2026-05-30 B3] z축 단면 절단용 클리핑 평면 — 모든 부재 재질이 공유한다.
  // normal (0,0,-1) → (normal·p + constant) > 0, 즉 z < constant 영역만 보인다.
  // constant 가 절단 높이. 초기 1e9 = 사실상 무한대(전체 보임). setSectionZ 로 조정.
  renderer.localClippingEnabled = true;
  window.sectionPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1e9);
  // [2026-06-01] y축 단면 절단용 클리핑 평면.
  // normal (0,1,0) → y + C > 0, 즉 y > -C 영역만 보임 (작은 y 쪽부터 잘림).
  // setSectionY 가 plane.constant = -y_slider 로 설정 → 슬라이더 y 미만 잘림.
  window.sectionPlaneY = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1e9);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(cx, cy, cz);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.screenSpacePanning = false;
  controls.minDistance = 100;
  // [2026-06-05] 줌아웃 한계 100000→1000000 확대 — 18층 등 고층 건물을 한 화면에
  //   담을 수 있도록 여유롭게. 원경 절단면(far=2000000) 안에 들어오는 범위.
  controls.maxDistance = 1000000;
  controls.update();

  // 광원
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5000, 5000, 10000);
  scene.add(dirLight);

  // [2026-05-30 B1] 바닥 그리드(GridHelper) 제거 — 사용자 요청.

  window.addEventListener('resize', onResize);
  animate();

  // WebChannel 연결 (Python 측 _ViewerThreeBridge)
  if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined'
      && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      qtBridge = channel.objects.bridge || null;
      if (qtBridge && qtBridge.js_log) {
        qtBridge.js_log('ViewerThree HTML 로드 완료 (M2-a 골격)');
      }
    });
  }
}

function onResize() {
  const container = document.getElementById('container');
  const w = container.clientWidth, h = container.clientHeight;
  if (camera.isOrthographicCamera) {
    // 직교: 세로 범위(top/bottom)는 유지하고 가로만 종횡비에 맞춰 갱신.
    const aspect = w / Math.max(1, h);
    camera.left = -camera.top * aspect;
    camera.right = camera.top * aspect;
  } else {
    camera.aspect = w / h;
  }
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ─────────────────────────────────────────────────────────
// [2026-06-11] 카메라 프리셋 — 아이소메트릭 / 위에서 보기(정확히 90°).
// 장면 bounding box 로 중심·반경을 구해 전체가 화면에 들어오게 맞춘다.
// ─────────────────────────────────────────────────────────
function _sceneFit() {
  const box = new THREE.Box3().setFromObject(scene);
  if (box.isEmpty()) return { ctr: new THREE.Vector3(3000, 3000, 1500), radius: 20000 };
  const ctr = new THREE.Vector3(); box.getCenter(ctr);
  const size = new THREE.Vector3(); box.getSize(size);
  const radius = 0.5 * Math.max(size.x, size.y, size.z, 1000);
  return { ctr: ctr, radius: radius };
}

// 직교(Orthographic) 카메라로 전환 — 소실점 없는 진짜 아이소메트릭/평면 뷰.
//   원근 카메라로 각도만 맞추면 멀리 있는 부재가 작아지는 왜곡이 남으므로,
//   두 프리셋 버튼은 투영 자체를 직교로 바꾼다. 이후 마우스 회전·줌도 직교 유지.
let orthoCamera = null;

function _applyOrthoView(pos, ctr, up, radius) {
  const container = document.getElementById('container');
  const w = container.clientWidth, h = container.clientHeight;
  const aspect = w / Math.max(1, h);
  const half = radius * 1.15;                     // 전체가 들어오게 약간 여유
  if (!orthoCamera) {
    orthoCamera = new THREE.OrthographicCamera(
      -half * aspect, half * aspect, half, -half, 10, 4000000);
  } else {
    orthoCamera.left = -half * aspect; orthoCamera.right = half * aspect;
    orthoCamera.top = half;            orthoCamera.bottom = -half;
  }
  orthoCamera.zoom = 1;
  orthoCamera.up.copy(up);
  orthoCamera.position.copy(pos);
  orthoCamera.lookAt(ctr);
  orthoCamera.updateProjectionMatrix();
  camera = orthoCamera;
  // OrbitControls 는 카메라에 묶이므로 새 카메라로 재생성(target 유지).
  if (controls) controls.dispose();
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(ctr);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.screenSpacePanning = false;
  controls.minZoom = 0.05;                        // 직교는 거리 대신 zoom 으로 줌
  controls.maxZoom = 50;
  controls.update();
}

window.setViewIso = function () {
  const f = _sceneFit();
  const dist = f.radius * 3 + 10000;              // 직교라 거리는 깊이 여유용
  const elev = 35.264 * Math.PI / 180;            // 정 아이소메트릭 앙각
  const azim = (-60 - 90) * Math.PI / 180;        // 초기 시점과 같은 방위감
  const pos = new THREE.Vector3(
    f.ctr.x + dist * Math.cos(elev) * Math.sin(azim),
    f.ctr.y + dist * Math.cos(elev) * Math.cos(azim),
    f.ctr.z + dist * Math.sin(elev));
  _applyOrthoView(pos, f.ctr, new THREE.Vector3(0, 0, 1), f.radius);
};

window.setViewTop = function () {
  const f = _sceneFit();
  const dist = f.radius * 3 + 10000;
  const pos = new THREE.Vector3(f.ctr.x, f.ctr.y, f.ctr.z + dist);
  // +y 가 화면 위(평면도 방향), 정확히 90° 수직 내려보기 — 직교라 진짜 평면도.
  _applyOrthoView(pos, f.ctr, new THREE.Vector3(0, 1, 0), f.radius);
};

// ─────────────────────────────────────────────────────────
// 메쉬 빌더 헬퍼 — vertices/faces/face_colors → BufferGeometry
// (M2-b 구현 대상. 현재는 골격만)
// ─────────────────────────────────────────────────────────
function _buildGeomFromMeshData(verticesList, facesList, faceColorsList) {
  // verticesList: (N, 3) — 꼭짓점 좌표
  // facesList:    (M, 3) — 삼각형 face 의 꼭짓점 인덱스
  // faceColorsList: (M, 4) — face 별 (R,G,B,A), 0~1
  // per-face 색을 per-vertex 로 풀기 위해 non-indexed BufferGeometry 사용.
  const M = facesList.length;
  const positions = new Float32Array(M * 9);   // 3 verts × 3 coords
  const colors = new Float32Array(M * 9);      // 3 verts × 3 RGB
  for (let i = 0; i < M; i++) {
    const face = facesList[i];
    const col = faceColorsList[i];
    for (let k = 0; k < 3; k++) {
      const v = verticesList[face[k]];
      positions[i*9 + k*3 + 0] = v[0];
      positions[i*9 + k*3 + 1] = v[1];
      positions[i*9 + k*3 + 2] = v[2];
      colors[i*9 + k*3 + 0] = col[0];
      colors[i*9 + k*3 + 1] = col[1];
      colors[i*9 + k*3 + 2] = col[2];
    }
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geom.computeVertexNormals();
  return geom;
}

// 현재 단면 클리핑 평면 목록 — 재질 생성 시 참조(전역 평면이라 constant 만 바뀜).
function _currentClipPlanes() {
  const _planes = [];
  if (window.sectionPlane) _planes.push(window.sectionPlane);
  if (window.sectionPlaneY) _planes.push(window.sectionPlaneY);
  return _planes;
}

function _buildMeshFromMeshData(verticesList, facesList, faceColorsList) {
  const geom = _buildGeomFromMeshData(verticesList, facesList, faceColorsList);
  const mat = new THREE.MeshLambertMaterial({
    vertexColors: true, side: THREE.DoubleSide,
    clippingPlanes: _currentClipPlanes(),
  });
  return new THREE.Mesh(geom, mat);
}

// ─────────────────────────────────────────────────────────
// 외부 API (Python 측 ViewerThree 가 runJavaScript 로 호출)
// M2-a: 시그너처 + 빈 본문. M2-b 에서 실 동작 구현.
// ─────────────────────────────────────────────────────────

// 부재 1개를 scene 에 추가/교체 (window.addComponent / addComponents 공용 본문).
function _addOneComponent(payload) {
  // payload = { comp_id, vertices, faces, face_colors }
  const id = payload.comp_id;
  if (componentMeshes[id]) {
    const old = componentMeshes[id];
    scene.remove(old);
    old.geometry.dispose();
    old.material.dispose();
    old.children.forEach(function (ch) {         // 벽 윤곽선 자식 정리
      if (ch.geometry) ch.geometry.dispose();
      if (ch.material) ch.material.dispose();
    });
    delete componentMeshes[id];
  }
  const mesh = _buildMeshFromMeshData(
    payload.vertices, payload.faces, payload.face_colors);
  mesh.userData.comp_id = id;
  _applyWallSolidMaterial(mesh, payload.face_colors);
  _maybeAddWallOutline(mesh, payload.face_colors);
  scene.add(mesh);
  componentMeshes[id] = mesh;
}

// 전 face 가 벽 채움 색인 메쉬(내벽 등 벽 단독 부재)인가.
function _allWallColor(fc) {
  if (!fc || !fc.length) return false;
  for (let i = 0; i < fc.length; i++) if (!_isWallColor(fc[i])) return false;
  return true;
}

// 벽 단독 메쉬는 조명 영향이 없는 단색(밝은 회색) 재질로 교체.
//   조명 음영(Lambert)을 받으면 보는 방향·잘린 안쪽 면에 따라 어둡게 보여
//   '속 빈 테두리' 느낌이 났다. 무음영 단색이면 단면으로 잘라 안쪽 면이
//   드러나도 바깥과 똑같은 밝은 회색 → 항상 속이 찬 솔리드로 보인다.
function _applyWallSolidMaterial(mesh, fc) {
  if (!_allWallColor(fc)) return;
  mesh.userData.isWall = true;
  mesh.geometry.computeBoundingBox();   // 단면 교차 윤곽선 계산용
  mesh.material.dispose();
  mesh.material = new THREE.MeshBasicMaterial({
    color: new THREE.Color(WALL_RGB[0], WALL_RGB[1], WALL_RGB[2]),
    side: THREE.DoubleSide,
    clippingPlanes: _currentClipPlanes(),
  });
}

// ─────────────────────────────────────────────────────────
// [2026-06-11] 단면 교차 윤곽선 — 벽이 단면 평면에 잘리면, 잘린 자리(벽 AABB 와
//   평면의 교차 사각형)에 검은 윤곽선을 그린다. 벽은 모두 축정렬 박스이므로
//   교차선은 사각형 4변. 슬라이더 이동·부재 추가/제거 때마다 재계산.
// ─────────────────────────────────────────────────────────
let sectionOutlineMesh = null;

function _ensureSectionOutline() {
  if (sectionOutlineMesh) return;
  sectionOutlineMesh = new THREE.LineSegments(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color: 0x222222 }));  // 클리핑 없음 — 절단면 위에 그림
  sectionOutlineMesh.frustumCulled = false;
  scene.add(sectionOutlineMesh);
}

// 비인덱스 position 배열의 모든 삼각형을 절단 평면과 교차시켜 절단선 세그먼트를
//   pts 에 수집 — 벽의 '실제 형상'(개구부 구멍 포함)으로 계산하므로 개구부 구간은
//   선이 끊기고, 개구부 양옆(문설주) 자리엔 짧은 마감선이 정확히 생긴다.
//   axisIdx: 절단축(1=y, 2=z), cut: 월드 절단값, (tx,ty,tz): 인스턴스 평행이동.
function _collectCutSegments(pos, axisIdx, cut, tx, ty, tz, pts) {
  const off = (axisIdx === 2) ? tz : ty;
  // +0.5mm 미세 이동 — 정점이 평면 위에 정확히 놓이는 경우(좌표·슬라이더 모두
  //   정수라 흔함)의 교차 누락을 피한다. 시각 차이는 없음.
  const cutL = cut - off + 0.5;
  for (let t = 0; t + 8 < pos.length; t += 9) {
    const d0 = pos[t + axisIdx] - cutL;
    const d1 = pos[t + 3 + axisIdx] - cutL;
    const d2 = pos[t + 6 + axisIdx] - cutL;
    if ((d0 > 0 && d1 > 0 && d2 > 0) || (d0 < 0 && d1 < 0 && d2 < 0)) continue;
    const ds = [d0, d1, d2];
    const found = [];
    for (let e = 0; e < 3; e++) {
      const i = e, j = (e + 1) % 3;
      const di = ds[i], dj = ds[j];
      if ((di > 0 && dj < 0) || (di < 0 && dj > 0)) {
        const s = di / (di - dj);
        const bi = t + i * 3, bj = t + j * 3;
        found.push([
          pos[bi]     + s * (pos[bj]     - pos[bi])     + tx,
          pos[bi + 1] + s * (pos[bj + 1] - pos[bi + 1]) + ty,
          pos[bi + 2] + s * (pos[bj + 2] - pos[bi + 2]) + tz,
        ]);
      }
    }
    if (found.length === 2) {
      pts.push(found[0][0], found[0][1], found[0][2],
               found[1][0], found[1][1], found[1][2]);
    }
  }
}

function _updateSectionOutlines() {
  _ensureSectionOutline();
  const pts = [];
  // 단면 활성 판정 — 비활성 시 constant=1e9(사실상 무한대).
  const zOn = window.sectionPlane && Math.abs(window.sectionPlane.constant) < 1e8;
  const yOn = window.sectionPlaneY && Math.abs(window.sectionPlaneY.constant) < 1e8;
  if (zOn || yOn) {
    const zc = zOn ? window.sectionPlane.constant : 0;
    const yc = yOn ? -window.sectionPlaneY.constant : 0;
    // 독립 벽 메쉬 — bbox 로 교차 후보만 거른 뒤 실제 형상으로 절단선 계산.
    for (const k in componentMeshes) {
      const m = componentMeshes[k];
      if (!m.userData.isWall || !m.geometry.boundingBox) continue;
      const bb = m.geometry.boundingBox;
      const pos = m.geometry.getAttribute('position').array;
      if (zOn && bb.min.z < zc && zc < bb.max.z)
        _collectCutSegments(pos, 2, zc, 0, 0, 0, pts);
      if (yOn && bb.min.y < yc && yc < bb.max.y)
        _collectCutSegments(pos, 1, yc, 0, 0, 0, pts);
    }
    // 인스턴스 벽 — 같은 형상을 인스턴스별 평행이동으로 반복 계산.
    const mat = new THREE.Matrix4();
    for (const k in instForms) {
      const f = instForms[k];
      if (!f.isWall) continue;
      if (!f.geom.boundingBox) f.geom.computeBoundingBox();
      const b = f.geom.boundingBox;
      const pos = f.geom.getAttribute('position').array;
      for (let i = 0; i < f.count; i++) {
        f.mesh.getMatrixAt(i, mat);
        const tx = mat.elements[12], ty = mat.elements[13], tz = mat.elements[14];
        if (zOn && b.min.z + tz < zc && zc < b.max.z + tz)
          _collectCutSegments(pos, 2, zc, tx, ty, tz, pts);
        if (yOn && b.min.y + ty < yc && yc < b.max.y + ty)
          _collectCutSegments(pos, 1, yc, tx, ty, tz, pts);
      }
    }
  }
  const g = sectionOutlineMesh.geometry;
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
  g.attributes.position.needsUpdate = true;
  g.computeBoundingSphere();
}

// face 색이 벽 채움 색(WALL_RGB)이면 적당한 회색 윤곽선(EdgesGeometry)을 자식으로 추가.
//   (내벽 채움 메쉬처럼 단일 색 박스면 매칭됨. 기둥·보가 섞인 외피벽 메쉬는
//    첫 face 색이 달라 매칭 안 되며, 그쪽은 프레임선이 이미 윤곽 역할을 한다.)
function _isWallColor(c) {
  return c && Math.abs(c[0] - WALL_RGB[0]) < 0.03 &&
              Math.abs(c[1] - WALL_RGB[1]) < 0.03 &&
              Math.abs(c[2] - WALL_RGB[2]) < 0.03;
}
function _maybeAddWallOutline(mesh, faceColorsList) {
  if (!faceColorsList || !faceColorsList.length) return;
  if (!_isWallColor(faceColorsList[0])) return;
  const eg = new THREE.EdgesGeometry(mesh.geometry, 30);
  const lm = new THREE.LineBasicMaterial({
    color: 0x222222, clippingPlanes: _currentClipPlanes(),
  });
  const ls = new THREE.LineSegments(eg, lm);
  ls.userData.isWallOutline = true;
  mesh.add(ls);
}

window.addComponent = function(payload) {
  _addOneComponent(payload);
  _hideEmptyMsg();
  _updateSectionOutlines();
};

// [3D 복제 최적화 2단계] 여러 부재를 한 번의 호출로 추가 — 직렬화·IPC 1회.
// 결과는 부재별 addComponent 를 N 번 부른 것과 완전히 동일(같은 본문 사용).
window.addComponents = function(payload) {
  const items = (payload && payload.items) || [];
  for (let i = 0; i < items.length; i++) {
    _addOneComponent(items[i]);
  }
  if (items.length) _hideEmptyMsg();
  _updateSectionOutlines();
};

// [2026-05-30 B3] z축 단면 절단 — enabled 면 z(높이) 위를 잘라 평면을 본다.
window.setSectionZ = function(z, enabled) {
  if (window.sectionPlane) {
    window.sectionPlane.constant = enabled ? z : 1e9;
  }
  _updateSectionOutlines();   // 잘린 자리 벽 윤곽선 재계산
};

// [2026-06-01] y축 단면 절단 — 반대 방향(작은 y 쪽부터 잘림).
// normal (0,1,0) + constant=-y  → y > slider 영역만 보임.
window.setSectionY = function(y, enabled) {
  if (window.sectionPlaneY) {
    window.sectionPlaneY.constant = enabled ? -y : 1e9;
  }
  _updateSectionOutlines();   // 잘린 자리 벽 윤곽선 재계산
};

// [2026-06-02] 거실 단면 정보 — 카메라를 외벽 정면 시점으로 이동 + Y축
// 클리핑 적용 후 그 뷰를 PNG dataURL 로 캡처. 끝나면 카메라·클리핑 원복.
// 외부에서 모듈 안쪽을 바라보는 시점 → 모듈 mesh 의 진짜 단면(기둥/보/슬래브)
// 이 그대로 보임.
window.captureSectionFront = function(cut_y) {
  if (typeof camera === 'undefined' || typeof renderer === 'undefined' ||
      typeof scene === 'undefined') return '';
  var bp = {
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: controls.target.x, ty: controls.target.y, tz: controls.target.z,
    up: camera.up.clone(),
    aspect: camera.aspect,
    cw: renderer.domElement.clientWidth || renderer.domElement.width,
    ch: renderer.domElement.clientHeight || renderer.domElement.height,
    clip: window.sectionPlaneY ? window.sectionPlaneY.constant : 1e9
  };
  var url = '';
  try {
    if (window.sectionPlaneY) window.sectionPlaneY.constant = -cut_y;
    var box = new THREE.Box3().setFromObject(scene);
    var ctr = new THREE.Vector3(); box.getCenter(ctr);
    var size = new THREE.Vector3(); box.getSize(size);
    var dist = Math.max(size.x, size.z, 5000) * 1.4;
    var TW = 1800, TH = 1100;
    renderer.setSize(TW, TH, false);
    camera.aspect = TW / TH;
    // 외부 시점: y < cut_y 쪽에서 +y 방향 바라보기. z 축이 위.
    camera.position.set(ctr.x, cut_y - dist, ctr.z);
    camera.up.set(0, 0, 1);
    camera.lookAt(ctr.x, cut_y + 100, ctr.z);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    url = renderer.domElement.toDataURL('image/png');
  } catch(e) {
    console.error('captureSectionFront', e);
  }
  // 원복
  try {
    camera.position.set(bp.px, bp.py, bp.pz);
    controls.target.set(bp.tx, bp.ty, bp.tz);
    camera.up.copy(bp.up);
    camera.aspect = bp.aspect;
    if (window.sectionPlaneY) window.sectionPlaneY.constant = bp.clip;
    renderer.setSize(bp.cw, bp.ch, false);
    camera.lookAt(controls.target);
    camera.updateProjectionMatrix();
    controls.update();
    renderer.render(scene, camera);
  } catch(_e) {}
  return url;
};

// ─────────────────────────────────────────────────────────
// [3D 복제 최적화 3단계] 형상 인스턴싱 — 같은 형상(formKey)을 InstancedMesh
// 하나로 묶어 GPU 업로드·드로우콜을 형상 종류 수만큼으로 줄인다.
//   instForms[key] = { geom, mesh(InstancedMesh), capacity, count,
//                      idToIdx{comp_id:idx}, idxToId[idx]=comp_id }
//   compForm[comp_id] = key  (인스턴스로 관리되는 부재 → 그 형상키)
// 인스턴스 i 의 월드정점 = geom(기준부재 절대좌표) + translation_i.
// 기준부재는 translation=(0,0,0) 이라 geom 위치 그대로 그려진다.
// ─────────────────────────────────────────────────────────
const instForms = {};
const compForm = {};

window.registerInstForm = function(key, verts, faces, colors, capacity) {
  if (instForms[key]) return;
  const geom = _buildGeomFromMeshData(verts, faces, colors);
  const mat = new THREE.MeshLambertMaterial({
    vertexColors: true, side: THREE.DoubleSide,
    clippingPlanes: _currentClipPlanes(),
  });
  const inst = new THREE.InstancedMesh(geom, mat, Math.max(1, capacity|0));
  inst.count = 0;
  inst.frustumCulled = false;   // 인스턴스 분산 배치 → 컬링 오판 방지
  scene.add(inst);
  instForms[key] = { geom: geom, mesh: inst, capacity: Math.max(1, capacity|0),
                     count: 0, idToIdx: {}, idxToId: [] };
  const form = instForms[key];
  // 벽 단독 형상이면: ① 무음영 단색 재질로 교체(독립 메쉬와 동일 — 솔리드 외관),
  //   ② 윤곽선 템플릿(EdgesGeometry 정점)을 만들어 둔다 — 인스턴스별 평행이동을
  //   더해 하나의 LineSegments 로 합쳐 그린다(드로우콜 1회).
  form.isWall = _allWallColor(colors);
  if (form.isWall) {
    inst.material.dispose();
    inst.material = new THREE.MeshBasicMaterial({
      color: new THREE.Color(WALL_RGB[0], WALL_RGB[1], WALL_RGB[2]),
      side: THREE.DoubleSide,
      clippingPlanes: _currentClipPlanes(),
    });
    const eg = new THREE.EdgesGeometry(geom, 30);
    form.edgeTpl = Float32Array.from(eg.getAttribute('position').array);
    eg.dispose();
    const om = new THREE.LineBasicMaterial({
      color: 0x222222, clippingPlanes: _currentClipPlanes() });
    form.outline = new THREE.LineSegments(new THREE.BufferGeometry(), om);
    form.outline.frustumCulled = false;
    form.outline.userData.isWallOutline = true;
    scene.add(form.outline);
  }
};

// 인스턴스 폼의 벽 윤곽선을 현재 인스턴스 평행이동에 맞춰 다시 합쳐 그린다.
function _refreshFormOutline(form) {
  if (!form || !form.isWall || !form.outline) return;
  const tpl = form.edgeTpl, L = tpl.length;
  const out = new Float32Array(L * form.count);
  const m = new THREE.Matrix4();
  for (let i = 0; i < form.count; i++) {
    form.mesh.getMatrixAt(i, m);
    const tx = m.elements[12], ty = m.elements[13], tz = m.elements[14];
    const base = i * L;
    for (let k = 0; k < L; k += 3) {
      out[base + k]     = tpl[k]     + tx;
      out[base + k + 1] = tpl[k + 1] + ty;
      out[base + k + 2] = tpl[k + 2] + tz;
    }
  }
  const g = form.outline.geometry;
  g.setAttribute('position', new THREE.BufferAttribute(out, 3));
  g.attributes.position.needsUpdate = true;
  g.setDrawRange(0, out.length / 3);
  g.computeBoundingSphere();
}

function _growInstForm(form) {
  const newCap = form.capacity * 2;
  const oldMesh = form.mesh;
  const inst = new THREE.InstancedMesh(form.geom, oldMesh.material, newCap);
  inst.count = form.count;
  inst.frustumCulled = false;
  const m = new THREE.Matrix4();
  for (let i = 0; i < form.count; i++) {
    oldMesh.getMatrixAt(i, m);
    inst.setMatrixAt(i, m);
  }
  scene.remove(oldMesh);   // geom·material 은 공유라 dispose 안 함
  scene.add(inst);
  form.mesh = inst;
  form.capacity = newCap;
  inst.instanceMatrix.needsUpdate = true;
}

window.addInstance = function(key, comp_id, tx, ty, tz) {
  const form = instForms[key];
  if (!form) return;
  const m = new THREE.Matrix4().makeTranslation(tx, ty, tz);
  if (comp_id in form.idToIdx) {           // 이미 있으면 위치만 갱신
    form.mesh.setMatrixAt(form.idToIdx[comp_id], m);
    form.mesh.instanceMatrix.needsUpdate = true;
    return;
  }
  if (form.count >= form.capacity) _growInstForm(form);
  const idx = form.count;
  form.idToIdx[comp_id] = idx;
  form.idxToId[idx] = comp_id;
  form.mesh.setMatrixAt(idx, m);
  form.count++;
  form.mesh.count = form.count;
  form.mesh.instanceMatrix.needsUpdate = true;
  compForm[comp_id] = key;
  if (!_batchingInst) { _refreshFormOutline(form); _updateSectionOutlines(); }
};

let _batchingInst = false;
// 여러 형상·인스턴스를 1회 호출로 일괄 등록(묶음 전송).
window.addInstanceBatch = function(payload) {
  const forms = (payload && payload.forms) || [];
  _batchingInst = true;
  for (let i = 0; i < forms.length; i++) {
    const f = forms[i];
    window.registerInstForm(f.key, f.verts, f.faces, f.colors, f.capacity);
    const insts = f.instances || [];
    for (let j = 0; j < insts.length; j++) {
      const it = insts[j];
      window.addInstance(f.key, it.id, it.t[0], it.t[1], it.t[2]);
    }
  }
  _batchingInst = false;
  for (let i = 0; i < forms.length; i++) _refreshFormOutline(instForms[forms[i].key]);
  _hideEmptyMsg();
  _updateSectionOutlines();
};

window.removeInstance = function(comp_id) {
  const key = compForm[comp_id];
  if (key === undefined) return false;
  const form = instForms[key];
  if (!form) { delete compForm[comp_id]; return false; }
  const idx = form.idToIdx[comp_id];
  const last = form.count - 1;
  if (idx !== last) {                      // 마지막 인스턴스를 빈자리로 이동(swap-remove)
    const m = new THREE.Matrix4();
    form.mesh.getMatrixAt(last, m);
    form.mesh.setMatrixAt(idx, m);
    const lastId = form.idxToId[last];
    form.idToIdx[lastId] = idx;
    form.idxToId[idx] = lastId;
  }
  form.count--;
  form.mesh.count = form.count;
  form.idxToId.length = form.count;
  delete form.idToIdx[comp_id];
  delete compForm[comp_id];
  form.mesh.instanceMatrix.needsUpdate = true;
  _refreshFormOutline(form);
  _updateSectionOutlines();
  return true;
};

// 모든 인스턴스 폼 제거(대량 재구성 시작 시).
window.clearAllInstances = function() {
  for (const key in instForms) {
    const form = instForms[key];
    scene.remove(form.mesh);
    form.geom.dispose();
    form.mesh.material.dispose();
    if (form.outline) {
      scene.remove(form.outline);
      form.outline.geometry.dispose();
      form.outline.material.dispose();
    }
  }
  for (const k in instForms) delete instForms[k];
  for (const k in compForm) delete compForm[k];
  _updateSectionOutlines();
};

// [검증용] 부재의 화면상 월드정점을 그대로 회수(독립 메시 / 인스턴스 공통).
window.getCompWorldVerts = function(comp_id) {
  if (componentMeshes[comp_id]) {
    const a = componentMeshes[comp_id].geometry.getAttribute('position');
    return Array.from(a.array);
  }
  const key = compForm[comp_id];
  if (key === undefined) return null;
  const form = instForms[key];
  const idx = form.idToIdx[comp_id];
  const m = new THREE.Matrix4();
  form.mesh.getMatrixAt(idx, m);
  const a = form.geom.getAttribute('position');
  const out = [];
  const v = new THREE.Vector3();
  for (let i = 0; i < a.count; i++) {
    v.fromBufferAttribute(a, i); v.applyMatrix4(m);
    out.push(v.x, v.y, v.z);
  }
  return out;
};

window.removeComponent = function(comp_id) {
  // 인스턴스로 관리되는 부재면 인스턴스에서 제거(swap-remove).
  if (window.removeInstance(comp_id)) return;
  const mesh = componentMeshes[comp_id];
  if (!mesh) return;
  scene.remove(mesh);
  mesh.geometry.dispose();
  mesh.material.dispose();
  mesh.children.forEach(function (ch) {          // 벽 윤곽선 자식 정리
    if (ch.geometry) ch.geometry.dispose();
    if (ch.material) ch.material.dispose();
  });
  delete componentMeshes[comp_id];
  _updateSectionOutlines();
};

// [7C-1] 캐드식 치수선 — 우측 컴포넌트 3D 전용. 폭/깊이/높이 3축, 숫자(mm)만(한글 없음).
let dimGroup = null;
function _disposeGroup(g) {
  if (!g) return;
  g.traverse(function(o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
}
function _makeNumberSprite(value, scale) {
  const text = String(Math.round(value));
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 64;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 256, 64);
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 44px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 34);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(scale * 4, scale, 1);
  return sp;
}
function _addDimLine(group, p1, p2, value, sscale) {
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(
    new Float32Array([p1[0], p1[1], p1[2], p2[0], p2[1], p2[2]]), 3));
  const mat = new THREE.LineBasicMaterial({ color: 0x222222, depthTest: false });
  const line = new THREE.LineSegments(geom, mat);
  line.renderOrder = 999;
  group.add(line);
  const sp = _makeNumberSprite(value, sscale);
  sp.position.set((p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2, (p1[2] + p2[2]) / 2);
  sp.renderOrder = 1000;
  group.add(sp);
}
// payload = { dx, dy, dz } (원점 중심 메시의 축별 외곽 치수, mm). null 이면 제거.
window.setDimensionLines = function(payload) {
  if (dimGroup) { scene.remove(dimGroup); _disposeGroup(dimGroup); dimGroup = null; }
  if (!payload) return;
  const dx = payload.dx, dy = payload.dy, dz = payload.dz;
  if (!(dx > 0 && dy > 0 && dz > 0)) return;
  const hx = dx / 2, hy = dy / 2, hz = dz / 2;
  const m = Math.max(dx, dy, dz);
  const off = m * 0.06 + 80;     // 박스에서 바깥으로 띄우는 거리
  const ss = m * 0.05 + 40;      // 숫자 스프라이트 크기
  dimGroup = new THREE.Group();
  _addDimLine(dimGroup, [-hx, -hy - off, -hz], [hx, -hy - off, -hz], dx, ss);  // 폭(X)
  _addDimLine(dimGroup, [-hx - off, -hy, -hz], [-hx - off, hy, -hz], dy, ss);  // 깊이(Y)
  _addDimLine(dimGroup, [-hx - off, -hy - off, -hz], [-hx - off, -hy - off, hz], dz, ss);  // 높이(Z)
  scene.add(dimGroup);
};

// [7C-2] 색 클래스별 부재 메시(단면명 보유) + hover 툴팁. 우측 컴포넌트 3D 전용.
let memberGroup = null;
let _hoverRaycaster = null;
let _hoverAttached = false;
function _attachHover() {
  if (_hoverAttached || !renderer) return;
  _hoverAttached = true;
  _hoverRaycaster = new THREE.Raycaster();
  const tip = document.getElementById('member-tip');
  renderer.domElement.addEventListener('mousemove', function (ev) {
    if (!memberGroup) { if (tip) tip.style.display = 'none'; return; }
    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((ev.clientX - rect.left) / rect.width) * 2 - 1,
      -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    _hoverRaycaster.setFromCamera(ndc, camera);
    const hits = _hoverRaycaster.intersectObjects(memberGroup.children, false);
    if (hits.length && hits[0].object.userData.sectionName) {
      tip.textContent = hits[0].object.userData.sectionName;
      tip.style.left = (ev.clientX - rect.left + 12) + 'px';
      tip.style.top = (ev.clientY - rect.top + 12) + 'px';
      tip.style.display = 'block';
    } else if (tip) {
      tip.style.display = 'none';
    }
  });
}
// payload = { members: [ { vertices, faces, face_colors, name } ] }. null/빈 → 제거.
window.setComponentMembers = function (payload) {
  if (memberGroup) { scene.remove(memberGroup); _disposeGroup(memberGroup); memberGroup = null; }
  const tip = document.getElementById('member-tip');
  if (tip) tip.style.display = 'none';
  if (!payload || !payload.members || !payload.members.length) return;
  _attachHover();
  memberGroup = new THREE.Group();
  for (const m of payload.members) {
    const mesh = _buildMeshFromMeshData(m.vertices, m.faces, m.face_colors);
    mesh.userData.sectionName = m.name || '';
    memberGroup.add(mesh);
  }
  scene.add(memberGroup);
  _hideEmptyMsg();
};

window.addRoom = function(payload) {
  const id = payload.room_id;
  if (roomMeshes[id]) {
    scene.remove(roomMeshes[id]);
    roomMeshes[id].geometry.dispose();
    roomMeshes[id].material.dispose();
    delete roomMeshes[id];
  }
  const mesh = _buildMeshFromMeshData(
    payload.vertices, payload.faces, payload.face_colors);
  mesh.userData.room_id = id;
  // 실 색면은 반투명
  mesh.material.transparent = true;
  mesh.material.opacity = 0.4;
  scene.add(mesh);
  roomMeshes[id] = mesh;
};

window.removeRoom = function(room_id) {
  const mesh = roomMeshes[room_id];
  if (!mesh) return;
  scene.remove(mesh);
  mesh.geometry.dispose();
  mesh.material.dispose();
  delete roomMeshes[room_id];
};

// ─────────────────────────────────────────────────────────
// 고스트·스냅·선택 — M2-c 구현
// ─────────────────────────────────────────────────────────

// ── 공용 헬퍼: 반투명 메쉬 빌더 ────────────────────────
function _buildGhostMesh(verticesList, facesList, faceColorsList,
                        opacity) {
  const mesh = _buildMeshFromMeshData(verticesList, facesList, faceColorsList);
  mesh.material.transparent = true;
  mesh.material.opacity = (typeof opacity === 'number') ? opacity : 0.5;
  mesh.material.depthWrite = false;   // 반투명 메쉬가 자기 자신 가리지 않게
  mesh.renderOrder = 10;
  return mesh;
}

function _disposeMesh(mesh) {
  if (!mesh) return;
  scene.remove(mesh);
  if (mesh.geometry) mesh.geometry.dispose();
  if (mesh.material) mesh.material.dispose();
}

// ── 부재 배치 미리보기 고스트 ──────────────────────────
window.updateGhost = function(payload) {
  _disposeMesh(ghostMesh);
  ghostMesh = _buildGhostMesh(payload.vertices, payload.faces,
                              payload.face_colors, 0.45);
  ghostMesh.userData.role = 'ghost';
  scene.add(ghostMesh);
};

window.clearGhost = function() {
  _disposeMesh(ghostMesh);
  ghostMesh = null;
};

window.setGhostEnabled = function(enabled) {
  if (ghostMesh) ghostMesh.visible = !!enabled;
};

// ── 개구부 고스트 ─────────────────────────────────────
window.updateOpeningGhost = function(payload) {
  _disposeMesh(openingGhostMesh);
  openingGhostMesh = _buildGhostMesh(payload.vertices, payload.faces,
                                     payload.face_colors, 0.55);
  openingGhostMesh.userData.role = 'opening_ghost';
  scene.add(openingGhostMesh);

window.clearOpeningGhost = function() {

// ── 실 고스트 (이동/복사 미리보기) ─────────────────────

// ── 스냅 마커: THREE.Points + 부재 꼭짓점 표시 ─────────
// vispy 의 visuals.Markers 와 동등 — snap_point (강조) + all_vertices (보조)
window.showSnapMarkers = function(payload) {
  _disposeMesh(snapMarker);
  const sp = payload.snap_point;          // [x, y, z]
  const av = payload.all_vertices || [];  // (N, 3)

  // 위치 배열 — 첫 항목 = 강조 점, 나머지 = 보조
  const positions = new Float32Array((1 + av.length) * 3);
  const colors = new Float32Array((1 + av.length) * 3);
  // 강조 점 — 빨강
  positions[0] = sp[0]; positions[1] = sp[1]; positions[2] = sp[2];
  colors[0] = 0.95; colors[1] = 0.2; colors[2] = 0.2;
  // 보조 점 — 짙은 노랑
  for (let i = 0; i < av.length; i++) {
    const v = av[i];
    positions[(i+1)*3 + 0] = v[0];
    positions[(i+1)*3 + 1] = v[1];
    positions[(i+1)*3 + 2] = v[2];
    colors[(i+1)*3 + 0] = 0.95;
    colors[(i+1)*3 + 1] = 0.75;
    colors[(i+1)*3 + 2] = 0.0;
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 180, sizeAttenuation: true, vertexColors: true,
    transparent: true, depthTest: false,
  });
  snapMarker = new THREE.Points(geom, mat);
  snapMarker.renderOrder = 20;
  scene.add(snapMarker);
};

window.hideSnapMarker = function() {
  if (snapMarker) {
    scene.remove(snapMarker);
    if (snapMarker.geometry) snapMarker.geometry.dispose();
    if (snapMarker.material) snapMarker.material.dispose();
    snapMarker = null;
  }
};

// ── 선택 박스: bbox 12 모서리 와이어프레임 (빨강) ──────
window.showSelectionBox = function(payload) {
  if (selectionBox) {
    scene.remove(selectionBox);
    if (selectionBox.geometry) selectionBox.geometry.dispose();
    if (selectionBox.material) selectionBox.material.dispose();
    selectionBox = null;
  }
  const a = payload.bbox_min;   // [x, y, z]
  const b = payload.bbox_max;
  // 8 꼭짓점
  const v = [
    [a[0], a[1], a[2]], [b[0], a[1], a[2]], [b[0], b[1], a[2]], [a[0], b[1], a[2]],
    [a[0], a[1], b[2]], [b[0], a[1], b[2]], [b[0], b[1], b[2]], [a[0], b[1], b[2]],
  ];
  // 12 모서리 — 각 (i, j) 쌍을 Float32Array 의 line segment 로
  const edges = [
    [0,1],[1,2],[2,3],[3,0],  // 하면
    [4,5],[5,6],[6,7],[7,4],  // 상면
    [0,4],[1,5],[2,6],[3,7],  // 기둥
  ];
  const positions = new Float32Array(edges.length * 6);
  for (let i = 0; i < edges.length; i++) {
    const [u, w] = edges[i];
    positions[i*6 + 0] = v[u][0];
    positions[i*6 + 1] = v[u][1];
    positions[i*6 + 2] = v[u][2];
    positions[i*6 + 3] = v[w][0];
    positions[i*6 + 4] = v[w][1];
    positions[i*6 + 5] = v[w][2];
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0xe53935, linewidth: 2,
    transparent: true, depthTest: false,
  });
  selectionBox = new THREE.LineSegments(geom, mat);
  selectionBox.renderOrder = 30;
  selectionBox.userData.comp_id = payload.comp_id;
  scene.add(selectionBox);
};

window.hideSelectionBox = function() {
  if (selectionBox) {
    scene.remove(selectionBox);
    if (selectionBox.geometry) selectionBox.geometry.dispose();
    if (selectionBox.material) selectionBox.material.dispose();
    selectionBox = null;
  }
};

function _hideEmptyMsg() {
  const el = document.getElementById('empty-msg');
  if (el) el.style.display = 'none';
}

// 페이지 로드 완료 후 init
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
